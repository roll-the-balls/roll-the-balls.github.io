# Деплой статики на GitHub Pages по официальному гайду Vite.
# Source: vite.dev/guide/static-deploy (адаптировано: Node 22, npm).
# Требуется ручной шаг: Settings -> Pages -> Source: GitHub Actions.
#
# Actions закреплены на полных SHA (S-04): теги vN — изменяемые ссылки,
# права у шагов максимальные (pages: write, id-token: write), поэтому
# перемещение тега не должно молча менять код, исполняемый с этими правами.
# Комментарий с тегом оставлен для читаемости; Dependabot обновляет SHA.
name: Deploy static content to Pages
on:
  push: { branches: ['main'] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: 'pages', cancel-in-progress: true }
jobs:
  deploy:
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: './dist' }
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4